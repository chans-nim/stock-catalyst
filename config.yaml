# ---- 수집 설정 ----
collect:
  # 폴링 주기 (초) — watch / 기본 실행 시 사용
  poll_interval_sec: 600
  # 뉴스 RSS 피드 목록 (네이버 API 정책 변경으로 언론사 RSS 직접 수집)
  news_feeds:
    - name: 연합뉴스 경제
      url: https://www.yna.co.kr/rss/economy.xml
    - name: 한국경제
      url: https://www.hankyung.com/feed/all-news
    - name: 매일경제
      url: https://www.mk.co.kr/rss/30000001/
    - name: 머니투데이
      url: https://rss.mt.co.kr/mt_news.xml
    - name: 뉴시스 경제
      url: https://www.newsis.com/RSS/economy.xml
    - name: 서울경제
      url: https://www.sedaily.com/rss/newsall
  # 기사 필터 키워드 (제목+요약에 하나라도 포함되면 수집, 비우면 전체 수집)
  # 공백 포함 키워드는 모든 단어가 포함돼야 매칭 (예: "수주 계약")
  news_keywords:
    - 특징주
    - 급등
    - 수주
    - 공급계약
    - 임상
    - 무상증자
    - 인수합병
    - 수혜주
  # 피드당 한 번에 가져올 최대 기사 수
  news_max_per_feed: 50
  # DART 공시 중 알림 대상에서 제외할 보고서명 키워드 (노이즈 제거)
  dart_exclude:
    - 자기주식취득결과
    - 대규모기업집단현황
    - 동일인등출자계열회사와의상품
    - 임원ㆍ주요주주특정증권등소유상황보고서

# ---- 분석 설정 ----
analysis:
  # AI 공급자: ollama (온디바이스, 무료 — telenews 방식) | openai (API 키 필요)
  provider: ollama
  ollama:
    base_url: http://localhost:11434
    model: qwen2.5:3b
    timeout_sec: 180
    # 로컬 소형 모델은 작은 배치가 안정적 (JSON 깨짐 방지)
    batch_size: 5
  # provider: openai 사용 시 모델
  openai_model: gpt-4o-mini
  # 이 중요도(1~5) 이상이면 실시간 텔레그램 알림 발송
  alert_min_importance: 4

# ---- bge-m3 임베딩 / 그룹화 / 섹터 분류 (telenews 방식) ----
embedding:
  enabled: true
  base_url: http://localhost:11434
  model: bge-m3
  timeout_sec: 60
  max_retries: 2
  batch_size: 8
  # 같은 사건으로 묶는 코사인 유사도 임계값 (telenews 기본 0.62)
  similarity_threshold: 0.62
  # 클러스터 매칭 대상 lookback
  cluster_lookback_hours: 48
  # 섹터 프로토타입 최소 유사도 (미달 시 '기타')
  sector_min_similarity: 0.35

# ---- 재료 리포트 (미전송만, 동일 종목·클러스터는 연관 기사) ----
report:
  # 리포트에 포함할 수집 범위 (시간)
  lookback_hours: 18
  # 이 중요도 이상만 포함 (★4 = 4)
  min_importance: 4
  # 텔레그램 한 메시지 최대 길이 (초과 분은 생략)
  max_chars: 4000
  # collect 후 미전송 후보가 있으면 리포트 자동 발송
  after_collect: true
  # 기전송 기사 중 동일 종목 연관 표시 최대 건수
  related_limit: 3
  # 연관 기사 검색 lookback (시간). 기본은 lookback_hours 와 동일
  related_lookback_hours: 48

# ---- 아침 브리핑 ----
briefing:
  # 매일 브리핑 발송 시각 (KST, HH:MM) - watch 프로세스가 이 시각에 자동 발송
  time: "08:00"
  # 브리핑에 포함할 수집 범위 (시간)
  lookback_hours: 18

# ---- 관심 종목 (브리핑에 시세 포함, 종목코드 6자리) ----
watchlist:
  - "005930"  # 삼성전자
  - "000660"  # SK하이닉스
