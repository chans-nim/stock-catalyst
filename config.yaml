# ---- 수집 설정 ----
collect:
  # 폴링 주기 (초)
  poll_interval_sec: 300
  # 네이버 뉴스 검색 키워드 (특징주/재료성 기사 위주)
  news_keywords:
    - 특징주
    - 급등주
    - 수주 계약
    - 임상 승인
    - 무상증자
    - 정부 정책 수혜주
  # 뉴스 키워드당 한 번에 가져올 기사 수 (최대 100)
  news_display: 30
  # DART 공시 중 알림 대상에서 제외할 보고서명 키워드 (노이즈 제거)
  dart_exclude:
    - 자기주식취득결과
    - 대규모기업집단현황
    - 동일인등출자계열회사와의상품
    - 임원ㆍ주요주주특정증권등소유상황보고서

# ---- 분석 설정 ----
analysis:
  openai_model: gpt-4o-mini
  # 이 중요도(1~5) 이상이면 실시간 텔레그램 알림 발송
  alert_min_importance: 4

# ---- 아침 브리핑 ----
briefing:
  # 매일 브리핑 발송 시각 (KST, HH:MM) - watch 프로세스가 이 시각에 자동 발송
  time: "08:00"
  # 브리핑에 포함할 수집 범위 (시간)
  lookback_hours: 18

# ---- 관심 종목 (브리핑에 시세 포함, 종목코드 6자리) ----
watchlist:
  - "005930"  # 삼성전자
  - "000660"  # SK하이닉스
